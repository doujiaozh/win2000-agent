; stunnel.conf for Windows 2000 + Python 2.7 TLS 1.2 bridge
; Put this file next to stunnel.exe
;
; Flow:
;   Python 2.7 (HTTP) -> 127.0.0.1:8443 -> stunnel -> TLS 1.2 -> open.bigmodel.cn

[zhipu]
client = yes
accept = 127.0.0.1:8443
connect = open.bigmodel.cn:443
sslVersion = TLSv1.2
verifyChain = no
; verifyChain = no is acceptable only on a trusted local machine.
; For production, download the CA bundle and use verifyChain = yes